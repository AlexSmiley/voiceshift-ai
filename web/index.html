<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoiceShift AI</title><style>body{background:#151322;color:#eee;font:18px system-ui;max-width:680px;margin:40px auto;padding:20px}button,select,input{font:inherit;margin:8px;accent-color:#a78bfa}button,select{padding:12px;background:#302746;color:white;border:1px solid #7661a0;border-radius:10px}canvas{width:100%;background:#211c32;border-radius:12px}label{display:block}a{color:#c4b5fd}</style><h1>VoiceShift AI</h1><p>Use headphones to avoid feedback.</p><canvas id="wave" width="640" height="150"></canvas><p id="status" role="status">Idle</p><button id="start">Start microphone</button><button id="stop">Stop</button><select id="preset"></select><label>Pitch <input id="pitch" type="range" min="-12" max="12" value="0"></label><label>Robot <input id="robot" type="range" min="0" max="1" step=".01" value="0"></label><label>Echo <input id="echo" type="range" min="0" max="1" step=".01" value="0"></label><label>Output device <select id="sink"><option value="">Default</option></select></label><button id="record">Record</button><button id="finish">Finish recording</button><div id="downloads"></div><script type="module" src="app.mjs"></script></html>
